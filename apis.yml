aid: figure-markets
name: Figure Markets
description: >-
  Figure Markets is a blockchain-native digital-asset marketplace built on the Provenance
  Blockchain that lets individuals and institutions trade, borrow against, and earn yield on
  crypto and real-world assets from a single account. Its exchange runs on Connamara's EP3
  matching engine with FIX and REST APIs, offering a central limit order book for crypto (BTC,
  ETH, and more), equities, bonds, alternative assets, and YLDS, the first SEC-registered
  yielding stablecoin. Products include Figure Exchange (pro trading), crypto-backed loans,
  Democratized Prime (HELOC-backed yield), and self-custodied wallets, bridging traditional
  order-book finance with on-chain clearing and settlement. The company is backed by DCM
  Ventures. The trading API is served from api.figuremarkets.com and is access-controlled;
  no public OpenAPI is currently published.
